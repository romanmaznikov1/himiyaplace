<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="gRed1" x1="10" y1="10" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <linearGradient id="gRed2" x1="22" y1="22" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#D62839"/>
    </linearGradient>
    <linearGradient id="gCenter" x1="32" y1="32" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8585"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <filter id="shadowTarget" x="-10%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E63946" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="40" cy="40" r="30" fill="url(#gRed1)" filter="url(#shadowTarget)"/>
  
  <!-- White ring 1 -->
  <circle cx="40" cy="40" r="23" fill="#FFF5F5"/>
  
  <!-- Middle red ring -->
  <circle cx="40" cy="40" r="17" fill="url(#gRed2)"/>
  
  <!-- White ring 2 -->
  <circle cx="40" cy="40" r="11" fill="#FFF5F5"/>
  
  <!-- Center bullseye -->
  <circle cx="40" cy="40" r="6" fill="url(#gCenter)"/>
  
  <!-- Shine on outer ring -->
  <ellipse cx="32" cy="24" rx="8" ry="5" fill="white" opacity="0.15" transform="rotate(-25 32 24)"/>

  <!-- Dart/arrow -->
  <g transform="rotate(-38 40 40)">
    <!-- Arrow shaft -->
    <line x1="40" y1="40" x2="40" y2="6" stroke="#3D5A80" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Arrow head -->
    <path d="M40 4 l-3.5 7 h7 Z" fill="#3D5A80"/>
    <!-- Arrow fletching -->
    <path d="M40 6 Q35 3 33 0" stroke="#5B8CB8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M40 6 Q45 3 47 0" stroke="#5B8CB8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Impact dot -->
  <circle cx="40" cy="40" r="2" fill="#FFF5F5" opacity="0.9"/>
</svg>
