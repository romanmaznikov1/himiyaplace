<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="gTicket" x1="4" y1="24" x2="76" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="50%" stop-color="#6C4DE6"/>
      <stop offset="100%" stop-color="#5A3DD0"/>
    </linearGradient>
    <linearGradient id="gTicketShine" x1="10" y1="24" x2="30" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B8A4FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C5CFC" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadowTicket" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5A3DD0" flood-opacity="0.25"/>
    </filter>
    <clipPath id="ticketClip">
      <path d="M8 28 a8 8 0 0 1 0 8 v0 a8 8 0 0 1 0 8 V56 a4 4 0 0 0 4 4 h56 a4 4 0 0 0 4-4 V44 a8 8 0 0 1 0-8 v0 a8 8 0 0 1 0-8 V24 a4 4 0 0 0-4-4 H12 a4 4 0 0 0-4 4 Z"/>
    </clipPath>
  </defs>

  <!-- Ticket body with notches -->
  <path d="M8 28 a8 8 0 0 1 0 8 v0 a8 8 0 0 1 0 8 V56 a4 4 0 0 0 4 4 h56 a4 4 0 0 0 4-4 V44 a8 8 0 0 1 0-8 v0 a8 8 0 0 1 0-8 V24 a4 4 0 0 0-4-4 H12 a4 4 0 0 0-4 4 Z" fill="url(#gTicket)" filter="url(#shadowTicket)"/>
  
  <!-- Shine -->
  <rect x="8" y="20" width="20" height="40" fill="url(#gTicketShine)" clip-path="url(#ticketClip)"/>

  <!-- Perforation line -->
  <line x1="56" y1="24" x2="56" y2="56" stroke="#B8A4FF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Star decorations on stub -->
  <path d="M66 36 l1.2 2.4 2.6.4-1.9 1.8.4 2.6-2.3-1.2-2.3 1.2.4-2.6-1.9-1.8 2.6-.4Z" fill="#E0D6FF" opacity="0.7"/>
  <path d="M66 46 l1 2 2.2.3-1.6 1.5.4 2.2-2-1-2 1 .4-2.2-1.6-1.5 2.2-.3Z" fill="#E0D6FF" opacity="0.5"/>

  <!-- Horizontal lines (text placeholder) -->
  <rect x="16" y="32" width="24" height="2.5" rx="1.25" fill="#E0D6FF" opacity="0.6"/>
  <rect x="16" y="38" width="18" height="2.5" rx="1.25" fill="#E0D6FF" opacity="0.45"/>
  <rect x="16" y="44" width="20" height="2.5" rx="1.25" fill="#E0D6FF" opacity="0.35"/>
</svg>
