    <!-- Оболочка hero до JS: постер логотипа на месте кадра hero (src/lib/hero-shell.ts).
         Только телефон в портрете. Позиция — те же формулы, что .hx-frame в Hero.tsx (шапка 170.7px + 4.5vw,
         низ — слоган 2 × 0.84 × clamp(34px, 11vw, 72px) + кнопки 44px + отступы 116px).
         Если разойдётся с hero — оболочка сама переедет на настоящий кадр, но лучше править вместе. -->
    <style>
      html { background: #03060d; }
      #hero-shell { display: none; }
      html.hero-shell #hero-shell {
        display: block; position: fixed; inset: 0; z-index: 70; overflow: hidden; pointer-events: none;
        mix-blend-mode: lighten;
        --hdr: calc(170.7px + 4.5vw);
        --zh: calc(100svh - var(--hdr) - 1.68 * clamp(34px, 11vw, 72px) - 160px);
        --fw: min(150vw, 2.4 * var(--zh));
        --ft: calc(var(--hdr) + var(--zh) / 2 + clamp(0px, var(--zh) / 2 - 0.211 * var(--fw) - 10px, 0.04 * var(--zh)) - 0.28125 * var(--fw));
      }
      @media (max-height: 700px) and (orientation: portrait) {
        html.hero-shell #hero-shell {
          --hdr: calc(162.7px + 4.5vw);
          --zh: calc(100svh - var(--hdr) - 1.68 * clamp(34px, 11vw, 72px) - 144px);
        }
      }
      #hero-shell .hs-pos { position: absolute; left: calc(50vw - var(--fw) / 2); top: var(--ft); width: var(--fw); aspect-ratio: 16 / 9; transform-origin: 0 0; }
      #hero-shell img {
        display: block; width: 100%; height: 100%;
        /* низ кадра гаснет, как у .hx-video; виньетка hero (эллипс 65%/60% слоя −8%) — маской */
        -webkit-mask-image: linear-gradient(#000 87%, transparent 93%), radial-gradient(75.4vw 69.6svh at calc(var(--fw) / 2) calc(46.52svh - var(--ft)), #000 55%, rgb(0 0 0 / 0.15) 100%);
        -webkit-mask-composite: source-in;
        mask-image: linear-gradient(#000 87%, transparent 93%), radial-gradient(75.4vw 69.6svh at calc(var(--fw) / 2) calc(46.52svh - var(--ft)), #000 55%, rgb(0 0 0 / 0.15) 100%);
        mask-composite: intersect;
        animation: hs-in 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes hs-in { from { opacity: 0; transform: scale(1.15); } }
      @media (prefers-reduced-motion: reduce) { #hero-shell img { animation: none; } }
    </style>

          if (nav && (nav.type === "reload" || nav.type === "back_forward") &&

          if (!q.has("nopreload") && sessionStorage.getItem("himiya:intro") !== "1" && !slow) return;
